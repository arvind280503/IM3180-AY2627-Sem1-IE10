name: Test Tactical Evaluator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-evaluator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and run tactical evaluator tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I. \
            tests/tactical_evaluator_test.cpp \
            Engines/TacticalEvaluator.cpp \
            evaluator.cpp board.cpp \
            -o tactical_evaluator_test
          ./tactical_evaluator_test
